## ROG Flow Z13 GZ302EA: expose attached displays as audio outputs.
##
## WirePlumber otherwise may restore the AMD HDMI controller's profile as
## "off" and leave its ports unavailable.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.vendor.id = "0x1002"
      }
    ]
    actions = {
      update-props = {
        api.acp.auto-profile = true
        api.acp.auto-port = true
      }
    }
  }
]
